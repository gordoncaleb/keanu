plugins {
    id 'com.palantir.git-version' version '3.1.0'
    id 'com.diffplug.spotless' version '8.0.0'
}

apply from: "gradle/spotless.gradle"

allprojects {
    version = gitVersion()

    apply plugin: "java"
    apply plugin: "idea"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    group = "io.improbable"
}

dependencies {
    implementation project(":keanu-project")
}

task formatApply {
    dependsOn("spotlessApply")
}
