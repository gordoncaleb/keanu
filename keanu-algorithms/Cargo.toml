[package]
name = "keanu-algorithms"
version = "0.1.0"
description = "Inference algorithms (optimizers, samplers, statistics) for the Keanu probabilistic programming library"
readme = "README.md"
documentation = "https://docs.rs/keanu-algorithms"
keywords = ["mcmc", "nuts", "optimization", "bayesian", "keanu"]
categories = ["science", "mathematics", "algorithms"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "THIRD-PARTY-NOTICES.md"]
edition.workspace = true
rust-version.workspace = true
# MIT, except src/optimizer/bobyqa/prima/ (a translation of PRIMA, BSD 3-Clause): see THIRD-PARTY-NOTICES.md
license = "MIT AND BSD-3-Clause"
repository.workspace = true
publish.workspace = true

[dependencies]
keanu-tensor = { workspace = true }
keanu-distributions = { workspace = true }
keanu-graph = { workspace = true }
smallvec = { version = "1", features = ["union"] }
rayon = { version = "1", optional = true }

[features]
default = []
# run independent chains on rayon's thread pool
parallel = ["dep:rayon"]

[dev-dependencies]
keanu-io = { workspace = true, features = ["protobuf", "json", "dot"] }
keanu-parity = { workspace = true }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
