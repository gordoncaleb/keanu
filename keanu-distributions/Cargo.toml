[package]
name = "keanu-distributions"
version = "0.1.0"
description = "Probability distributions for the Keanu probabilistic programming library"
readme = "README.md"
documentation = "https://docs.rs/keanu-distributions"
keywords = ["probability", "distributions", "statistics", "sampling", "keanu"]
categories = ["science", "mathematics"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
keanu-tensor = { workspace = true }
rand = "0.10"
rand_chacha = "0.10"

[dev-dependencies]
keanu-parity = { workspace = true }
serde_json = "1.0.154"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
