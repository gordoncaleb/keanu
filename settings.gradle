pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include 'keanu-project',
    'docs',
    'benchmarks',
    'keanu-examples:coalMiningDisasters',
    'keanu-examples:customDistribution',
    'keanu-examples:bayesianMethodsForHackers'
