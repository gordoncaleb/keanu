[package]
name = "keanu-tensor"
version = "0.1.0"
description = "N-dimensional tensors for the Keanu probabilistic programming library"
readme = "README.md"
documentation = "https://docs.rs/keanu-tensor"
keywords = ["tensor", "ndarray", "linear-algebra", "numerics", "keanu"]
categories = ["science", "mathematics"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "linalg"] }
smallvec = { version = "1", features = ["union"] }

[dev-dependencies]
keanu-parity = { workspace = true }
proptest = "1.12.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
