[package]
name = "keanu-io"
version = "0.1.0"
description = "Saving and loading Keanu models (protobuf and JSON) and exporting them as DOT graphs"
readme = "README.md"
documentation = "https://docs.rs/keanu-io"
keywords = ["protobuf", "serialization", "graphviz", "bayesian", "keanu"]
categories = ["science", "encoding"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "proto/**/*.proto"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["protobuf", "json", "dot"]
# binary protobuf files (.pb)
protobuf = ["dep:prost"]
# JSON files (the protobuf JSON mapping, as Java's JsonSaver writes)
json = ["dep:prost", "dep:pbjson", "dep:serde", "dep:serde_json"]
# Graphviz DOT export
dot = []

[dependencies]
keanu-distributions = { workspace = true }
keanu-graph = { workspace = true }
keanu-tensor = { workspace = true }
prost = { version = "0.14", optional = true }
pbjson = { version = "0.9", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }

[dev-dependencies]
keanu-parity = { workspace = true }
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[[test]]
name = "golden_models"
required-features = ["protobuf", "json"]

[[test]]
name = "round_trip"
required-features = ["protobuf", "json"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
