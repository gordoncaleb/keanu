plugins {
    id 'org.jetbrains.kotlin.jvm' version "${kotlinVersion}"
}

dependencies {
    implementation project(':keanu-project')

    testImplementation 'junit:junit:4.13.2'
}

kotlin {
    jvmToolchain(17)
}

// Extracts code snippets from the Java/Kotlin tests into the markdown docs. Requires python3.
tasks.register('writeSnippets', Exec) {
    commandLine 'python3', 'bin/snippet_writer.py'
}
