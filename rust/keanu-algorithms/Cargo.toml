[package]
name = "keanu-algorithms"
version = "0.1.0"
description = "Inference algorithms (optimizers, samplers, statistics) for the Keanu probabilistic programming library"
edition.workspace = true
# MIT, except src/optimizer/bobyqa/prima/ (a translation of PRIMA, BSD 3-Clause): see THIRD-PARTY-NOTICES.md
license = "MIT AND BSD-3-Clause"
repository.workspace = true
publish.workspace = true

[dependencies]
keanu-tensor = { path = "../keanu-tensor" }
keanu-distributions = { path = "../keanu-distributions" }
keanu-graph = { path = "../keanu-graph" }
rayon = { version = "1", optional = true }

[features]
default = []
# run independent chains on rayon's thread pool
parallel = ["dep:rayon"]

[dev-dependencies]
keanu-io = { path = "../keanu-io" }
keanu-parity = { path = "../keanu-parity" }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true
