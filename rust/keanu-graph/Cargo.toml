[package]
name = "keanu-graph"
version = "0.1.0"
description = "Computation graphs, value propagation and auto diff for the Keanu probabilistic programming library"
readme = "README.md"
documentation = "https://docs.rs/keanu-graph"
keywords = ["probabilistic", "bayesian", "autodiff", "graph", "keanu"]
categories = ["science", "mathematics"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
keanu-tensor = { workspace = true }
keanu-distributions = { workspace = true }
smallvec = { version = "1", features = ["union"] }

[dev-dependencies]
keanu-parity = { workspace = true }
proptest = "1"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
