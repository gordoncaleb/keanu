[workspace]
resolver = "3"
members = [
    "keanu-tensor",
    "keanu-distributions",
    "keanu-parity",
    "keanu-io", "keanu-distributions", "keanu-graph", "keanu-io",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/gordoncaleb/keanu"
publish = false

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
