[workspace]
resolver = "3"
members = [
    "keanu-tensor",
    "keanu-distributions",
    "keanu-graph",
    "keanu-io",
    "keanu-algorithms",
    "keanu-parity",
    "keanu",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/gordoncaleb/keanu"
publish = false

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The statistical tests (MCMC examples, golden sampler comparisons) run long chains; optimise them.
[profile.test]
opt-level = 3
