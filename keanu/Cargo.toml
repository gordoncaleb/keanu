[package]
name = "keanu"
version = "0.1.0"
description = "Probabilistic programming: build Bayesian networks, then optimize or sample them"
readme = "README.md"
documentation = "https://docs.rs/keanu"
keywords = ["probabilistic-programming", "bayesian", "mcmc", "statistics", "inference"]
categories = ["science", "mathematics"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "examples/**/*.rs", "examples/data/*.csv"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["json"]
# load and save models as JSON
json = ["keanu-io/json"]
# load and save models as binary protobuf
protobuf = ["keanu-io/protobuf"]
# Graphviz DOT export of graphs
dot = ["keanu-io/dot"]
# run independent MCMC chains in parallel (rayon)
parallel = ["keanu-algorithms/parallel"]

[dependencies]
keanu-tensor = { workspace = true }
keanu-distributions = { workspace = true }
keanu-graph = { workspace = true }
keanu-algorithms = { workspace = true }
keanu-io = { workspace = true }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "tensors"
harness = false

[[bench]]
name = "models"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
